name: 24/7 Avengers Pune Ticket Sniper

on:
  schedule:
    # Runs automatically on GitHub Cloud every 5 minutes 24/7
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual run button

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Ticket Check
        run: python sniper.py --once
